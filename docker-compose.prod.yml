version: '3.8'

# ─── Shared network that Traefik can reach our containers on ──────────────────
networks:
  pm-network:
    external: true          # Created manually: docker network create pm-network
  pm-internal:
    driver: bridge          # Private network for DB/Redis (not exposed to Traefik)

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: pm_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pm-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pm_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - pm-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: pm_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - pm-network     # Traefik-accessible network
      - pm-internal    # Can reach postgres + redis
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=pm-network"
      # ── Router: /api/* → backend ────────────────────────────────────────────
      - "traefik.http.routers.pm-backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.pm-backend.entrypoints=websecure"
      - "traefik.http.routers.pm-backend.tls=true"
      - "traefik.http.routers.pm-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pm-backend.priority=10"
      # ── Service: internal port ───────────────────────────────────────────────
      - "traefik.http.services.pm-backend.loadbalancer.server.port=5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: pm_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NODE_ENV: production
    networks:
      - pm-network     # Traefik-accessible network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=pm-network"
      # ── Router: all other traffic → frontend ─────────────────────────────────
      - "traefik.http.routers.pm-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.pm-frontend.entrypoints=websecure"
      - "traefik.http.routers.pm-frontend.tls=true"
      - "traefik.http.routers.pm-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pm-frontend.priority=1"
      # ── Service: internal port ───────────────────────────────────────────────
      - "traefik.http.services.pm-frontend.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  uploads_data:
